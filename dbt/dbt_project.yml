name: urbanflow
version: "1.0.0"
config-version: 2
profile: urbanflow
model-paths: ["models"]

models:
  urbanflow:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      +partition_by:
        field: trip_date
        data_type: date
      +cluster_by: ["service_type"]

